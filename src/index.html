<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barber Shop Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="brand-mark">✂</div>
      <h1>Barber Shop</h1>
      <p>نظام إدارة محل الحلاقة</p>
      <form id="loginForm">
        <label>اسم المستخدم</label>
        <input id="username" autocomplete="username" value="admin" required>
        <label>كلمة المرور</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور" required>
        <button class="primary full" type="submit">تسجيل الدخول</button>
        <div id="loginError" class="error"></div>
      </form>
      <small>الحساب الأولي: admin / 1234 — غيّر كلمة المرور بعد الدخول.</small>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="side-brand"><span>✂</span><strong>Barber Shop</strong></div>
      <nav>
        <button class="nav-btn active" data-page="dashboard">لوحة التحكم</button>
        <button class="nav-btn" data-page="employees">الموظفين</button>
        <button class="nav-btn" data-page="services">الخدمات والأسعار</button>
        <button class="nav-btn" data-page="sales">المبيعات</button>
        <button class="nav-btn" data-page="expenses">المصاريف</button>
        <button class="nav-btn" data-page="reports">التقارير</button>
        <button class="nav-btn" data-page="settings">الإعدادات</button>
      </nav>
      <button id="logoutBtn" class="logout">تسجيل الخروج</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h2 id="pageTitle">لوحة التحكم</h2>
          <span id="today"></span>
        </div>
        <div class="shop-pill">● يعمل محلياً على هذا الكمبيوتر</div>
      </header>
      <section id="page"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
